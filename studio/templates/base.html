<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Shorts Studio{% endblock %}</title>
{% block head %}{% endblock %}
<style>
:root { --bg:#14161a; --card:#1e2128; --line:#2c313a; --text:#e8e9ec; --dim:#9aa0ab; --acc:#f2c14e; --red:#e5644e; --green:#5fb36a; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
header { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
header a.logo { color:var(--acc); font-weight:700; text-decoration:none; font-size:18px; }
header nav { margin-left:auto; display:flex; gap:14px; }
header nav a { color:var(--dim); text-decoration:none; white-space:nowrap; font-size:14px; }
main { max-width:960px; margin:0 auto; padding:16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
h1 { font-size:22px; margin:4px 0 14px; } h2 { font-size:17px; margin:0 0 10px; }
a { color:var(--acc); }
.btn { display:inline-block; background:var(--acc); color:#1a1a1a; border:0; border-radius:9px; padding:10px 16px; font-weight:600; font-size:15px; cursor:pointer; text-decoration:none; }
.btn.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
.btn.red { background:var(--red); color:#fff; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
input[type=text], input[type=number], textarea, select { width:100%; background:#111317; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px; font:inherit; }
textarea.code { font:12px/1.4 ui-monospace, Consolas, monospace; min-height:320px; }
label { display:block; margin:10px 0 4px; color:var(--dim); font-size:13px; }
.menu a { display:flex; align-items:center; gap:12px; padding:14px; border-radius:10px; color:var(--text); text-decoration:none; border:1px solid var(--line); margin-bottom:8px; background:#191c22; }
.menu a span.i { font-size:22px; width:30px; text-align:center; }
.dim { color:var(--dim); } .ok { color:var(--green); } .warn { color:var(--acc); } .err { color:var(--red); }
.badge { font-size:12px; padding:2px 8px; border-radius:20px; border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
.meter { height:8px; background:#111317; border-radius:5px; overflow:hidden; } .meter i { display:block; height:100%; background:var(--acc); }
table { width:100%; border-collapse:collapse; font-size:13px; }
td, th { border-bottom:1px solid var(--line); padding:6px; text-align:left; vertical-align:top; }
.scroll { overflow-x:auto; }
.hook { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:8px; }
.hook b { color:var(--acc); }
video { width:100%; max-width:360px; border-radius:10px; background:#000; }
.spin { display:inline-block; width:14px; height:14px; border:2px solid var(--acc); border-right-color:transparent; border-radius:50%; animation:r 1s linear infinite; vertical-align:-2px; }
@keyframes r { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<header><a class="logo" href="/" style="white-space:nowrap">🎬 Studio</a>
<nav><a href="/new">Yangi</a><a href="/own">O'z ssenariyim</a><a href="/settings">Sozlamalar</a></nav></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
